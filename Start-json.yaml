# =========================================
#                 锚点配置
# =========================================
anchor:
  # 代理提供商锚点
  BaseProvider: &BaseProvider {type: http, interval: 3600, proxy: DIRECT, health-check: {enable: true, url: 'https://g.cn/generate_204', interval: 10}, override: {skip-cert-verify: true, udp: true}, path: ./providers/sub-store.yaml, filter: '^(?!.*(群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'}
  # 策略组类型模板 - 定义不同的策略组基础配置
  BaseUT: &BaseUT {type: url-test, include-all: true, tolerance: 20, interval: 120, url: https://cp.cloudflare.com/generate_204}
  # 节点筛选正则表达式 - 基于地理位置和关键词过滤
  FilterHK: &FilterHK {filter: '^(?=.*(?i)(港|🇭🇰|HK|Hong|HKG)).*$'}
  FilterSG: &FilterSG {filter: '^(?=.*(?i)(坡|🇸🇬|SG|Sing|SIN|XSP)).*$'}
  FilterJP: &FilterJP {filter: '^(?=.*(?i)(日|🇯🇵|JP|Japan|NRT|HND|KIX|CTS|FUK)).*$'}
  FilterUS: &FilterUS {filter: '^(?=.*(?i)(美|🇺🇸|US|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)).*$'}
  FilterTW: &FilterTW {filter: '^(?=.*(?i)(台|🇼🇸|🇹🇼|TW|tai|TPE|TSA|KHH)).*$'}

  # 策略组代理列表模板 - 预定义的代理节点优先级排序
  SelectAU: &SelectAU {type: url-test, include-all: true, tolerance: 20, interval: 120, url: https://cp.cloudflare.com/generate_204, filter: "^((?!(直连)).)*$"}
  SelectMS: &SelectMS {type: select, include-all: true, proxies: [香港节点, 美国节点, 日本节点, 新加坡节点, 台湾节点, 自动选择, 全球直连]}
  SelectMH: &SelectMH {type: select, proxies: [香港节点, 美国节点, 新加坡节点, 日本节点, 台湾节点, 手动选择, 自动选择, 全球直连], use: [Sub-store]}
  SelectHK: &SelectHK {type: select, proxies: [香港节点, 美国节点, 新加坡节点, 日本节点, 台湾节点, 手动选择, 自动选择, 全球直连]}
  SelectUS: &SelectUS {type: select, proxies: [美国节点, 香港节点, 新加坡节点, 日本节点, 台湾节点, 手动选择, 自动选择, 全球直连]}
  SelectSG: &SelectSG {type: select, proxies: [新加坡节点, 香港节点, 美国节点, 日本节点, 台湾节点, 手动选择, 自动选择, 全球直连]}
  SelectJP: &SelectJP {type: select, proxies: [日本节点, 香港节点, 美国节点, 新加坡节点, 台湾节点, 手动选择, 自动选择, 全球直连]}
  SelectTW: &SelectTW {type: select, proxies: [台湾节点, 香港节点, 美国节点, 新加坡节点, 日本节点, 手动选择, 自动选择, 全球直连]}

  # 规则提供者相关锚点
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

# =========================================
#               代理提供商
# =========================================
proxy-providers:
  # 机场节点集合，使用时请修改
  Sub-store: {<<: *BaseProvider, url: '订阅链接请复制通用订阅'}

# =========================================
#                 外部访问配置
# =========================================
port:                               7890                                                                                        # HTTP 代理端口
socks-port:                         7891                                                                                        # SOCKS 代理端口
mixed-port:                         7893                                                                                        # 混合端口
redir-port:                         7892                                                                                        # Redir 透明代理端口
tproxy-port:                        7894                                                                                        # TProxy 端口
allow-lan:                          true                                                                                        # 允许局域网访问
bind-address:                       "*"                                                                                         # 监听所有网卡
authentication:                     [mihomo:mihomo666]                                                                          # 身份验证

# =========================================
#                 内核运行配置
# =========================================
find-process-mode:                  strict                                                                                      # 进程匹配
mode:                               rule                                                                                        # 运行模式
log-level:                          warning                                                                                     # 日志等级
ipv6:                               true                                                                                        # IPV6支持
profile:                            {store-selected: true, store-fake-ip: true}                                                 # 面板数据持久化设置
tcp-concurrent:                     true                                                                                        # TCP并发
unified-delay:                      true                                                                                        # 统一延迟
keep-alive-interval:                15                                                                                          # TCP 保活间隔
keep-alive-idle:                    600                                                                                         # TCP 空闲等待 
experimental:                       {quic-go-disable-gso: true}                                                                 # 禁用 GSO

# =========================================
#                 面板配置
# =========================================
external-ui:                        ui                                                                                          # 面板路径
external-ui-name:                   zashboard                                                                                   # 面板名称
external-ui-url:                    https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip                    # 面板下载地址
external-controller:                "0.0.0.0:9090"                                                                              # 面板监听端口
secret:                             "password"                                                                                  # 面板访问密码

# =========================================
#                 GEO 数据库配置
# =========================================
geox-url:
  geoip: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat"
  geosite: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"
  mmdb: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.metadb"
geodata-loader: standard                                                                                                        # GEO加载模式
geo-auto-update:                    true                                                                                        # 自动更新   
geo-update-interval:                24                                                                                          # 间隔一天（24小时）

# =========================================
#             TUN入站配置
# =========================================
tun:
  enable:                           true                                                                                        # 启用 TUN 功能，用于透明代理
  stack:                            system                                                                                      # 使用系统协议栈（性能最佳）
  device:                           mihomo                                                                                      # TUN 虚拟网卡名称，可自定义
  dns-hijack:                       [any:53, tcp://any:53]                                                                      # DNS 劫持设置
  auto-route:                       true                                                                                        # 自动添加路由表
  auto-detect-interface:            true                                                                                        # 自动检测网络接口，绑定 TUN
  auto-redirect:                    true                                                                                        # 自动重定向流量到 TUN
  endpoint-independent-nat:         true                                                                                        # 启用端点独立 NAT，保证 UDP 稳定性
  route-exclude-address-set:        [China-IP]                                                                                  # 绕过IP

# =========================================
#                 DNS 配置
# =========================================
dns:
  enable:                           true                                                                                        # 启用 DNS 功能 
  ipv6:                             true                                                                                        # 支持 IPv6
  enhanced-mode:                    fake-ip                                                                                     # 启用 Fake-IP
  fake-ip-range:                    198.18.0.1/16                                                                               # IPv4 Fake-IP 网段
  listen:                           0.0.0.0:1053                                                                                # DNS 监听地址和端口
  respect-rules:                    false                                                                                       # 是否遵循DNS规则
  fake-ip-filter-mode:              blacklist                                                                                   # Fake-IP 黑名单
  nameserver: [https://doh.pub/dns-query, https://dns.alidns.com/dns-query]                                                     # DNS 上游服务器（用于国内域名解析）
  default-nameserver: [https://223.5.5.5/dns-query, tls://1.1.1.1:853]                                                          # 默认DNS服务器 （用于解析上游Doh和兜底解析）
  fake-ip-filter:                                                                                                               # fake-ip 黑名单列表 (列表内的域名解析将返回真实ip)
    - "*.lan"
    - "*.local"
    - "*.home"
    - "*.arpa"
    - rule-set:China
    - rule-set:Private

# =========================================
#                 流量嗅探
# =========================================
sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-dns-mapping: true
  sniff:
    QUIC: { ports: [443] }
    TLS:  { ports: [443, 8443] }
    HTTP: { ports: [80, 8080-8880] }
  force-domain:
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
    - "+.tiktok.com"
  skip-domain:
    - "dlg.io.mi.com"
    - "+.mi.com"
    - "+.xiaomi.com"
    - "+.miwifi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"
# ══ hosts配置 ══ 谷歌商店  解决无法下载的问题
hosts:
  'services.googleapis.cn': ['services.googleapis.com']

