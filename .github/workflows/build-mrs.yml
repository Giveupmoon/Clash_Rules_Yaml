name: Sync List and Build MRS Rules

on:
  push:
    paths:
      - 'Rules/*.yaml'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Install Mihomo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo MetaCubeX/mihomo --pattern "mihomo-linux-amd64-v*.gz"
          FILE=$(ls mihomo-linux-amd64-v*.gz | grep -v "compatible" | head -n 1)
          gzip -d "$FILE"
          BIN_NAME="${FILE%.gz}"
          chmod +x "$BIN_NAME"
          sudo mv "$BIN_NAME" /usr/local/bin/mihomo
          mihomo -v

      - name: Sync Rules and Compile MRS
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import subprocess
          import yaml

          RULES_DIR = "Rules"
          DOMAIN_TYPES = {"DOMAIN", "DOMAIN-SUFFIX", "DOMAIN-KEYWORD"}
          IP_TYPES = {"IP-CIDR", "IP-CIDR6"}

          DUMMY_DOMAIN = ["DOMAIN,dummy-placeholder-never-match.invalid"]
          DUMMY_IP = ["0.0.0.0/32"]

          def deduplicate_keep_order(items):
              seen = set()
              result = []
              for item in items:
                  if item not in seen:
                      seen.add(item)
                      result.append(item)
              return result

          for yaml_file in glob.glob(f"{RULES_DIR}/*.yaml"):
              base_name = os.path.splitext(os.path.basename(yaml_file))[0]

              with open(yaml_file, "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f) or {}

              payload = data.get("payload", []) or []
              yaml_domains = []
              yaml_ips = []

              for item in payload:
                  raw = str(item).strip().strip("'\"")
                  if not raw:
                      continue

                  parts = [p.strip() for p in raw.split(",")]
                  rule_type = parts[0].upper()

                  if rule_type in DOMAIN_TYPES:
                      yaml_domains.append(raw)
                  elif rule_type in IP_TYPES:
                      if len(parts) >= 2:
                          cidr = parts[1]
                          if "/" not in cidr:
                              cidr = f"{cidr}/128" if ":" in cidr else f"{cidr}/32"
                          yaml_ips.append(cidr)
                  elif "/" in raw or ":" in raw:
                      yaml_ips.append(raw)

              yaml_domains = deduplicate_keep_order(yaml_domains)
              yaml_ips = deduplicate_keep_order(yaml_ips)

              # --- 处理域名规则 ---
              domain_list_file = os.path.join(RULES_DIR, f"{base_name}_domain.list")
              domain_mrs_file = os.path.join(RULES_DIR, f"{base_name}_domain.mrs")

              domains_to_write = yaml_domains if yaml_domains else DUMMY_DOMAIN
              with open(domain_list_file, "w", encoding="utf-8") as f:
                  f.write("\n".join(domains_to_write) + "\n")
              
              subprocess.run(
                  ["mihomo", "convert-ruleset", "domain", "text", domain_list_file, domain_mrs_file],
                  check=True
              )
              status_domain = f"{len(yaml_domains)} rules" if yaml_domains else "cleared -> set dummy"
              print(f"[Domain] {base_name}: {status_domain} -> {domain_mrs_file}")

              # --- 处理 IP 规则 ---
              ip_list_file = os.path.join(RULES_DIR, f"{base_name}_ip.list")
              ip_mrs_file = os.path.join(RULES_DIR, f"{base_name}_ip.mrs")

              ips_to_write = yaml_ips if yaml_ips else DUMMY_IP
              with open(ip_list_file, "w", encoding="utf-8") as f:
                  f.write("\n".join(ips_to_write) + "\n")
              
              subprocess.run(
                  ["mihomo", "convert-ruleset", "ipcidr", "text", ip_list_file, ip_mrs_file],
                  check=True
              )
              status_ip = f"{len(yaml_ips)} rules" if yaml_ips else "cleared -> set dummy"
              print(f"[IP] {base_name}: {status_ip} -> {ip_mrs_file}")
          EOF

      - name: Commit and Push to Rules
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A Rules/*.list Rules/*.mrs
          if git diff --staged --quiet; then
            echo "No changes in .list or .mrs files."
          else
            git commit -m "Auto-sync rules to list and overwrite MRS [skip ci]"
            git push
          fi