name: Update List and Build MRS Rules

on:
  push:
    paths:
      - 'Rules/*.yaml'
      - '.github/workflows/build-mrs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Install Mihomo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo MetaCubeX/mihomo --pattern "mihomo-linux-amd64-v*.gz"
          FILE=$(ls mihomo-linux-amd64-v*.gz | grep -v "compatible" | head -n 1)
          gzip -d "$FILE"
          BIN_NAME="${FILE%.gz}"
          chmod +x "$BIN_NAME"
          sudo mv "$BIN_NAME" /usr/local/bin/mihomo
          mihomo -v

      - name: Append to List and Compile MRS
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import subprocess
          import yaml

          RULES_DIR = "Rules"
          DOMAIN_TYPES = {"DOMAIN", "DOMAIN-SUFFIX", "DOMAIN-KEYWORD"}
          IP_TYPES = {"IP-CIDR", "IP-CIDR6"}

          def clean_rule_line(raw_line):
              if "#" in raw_line:
                  raw_line = raw_line.split("#", 1)[0]
              return raw_line.strip().strip("'\"")

          def read_existing_list(file_path):
              if not os.path.exists(file_path):
                  return []
              rules = []
              with open(file_path, "r", encoding="utf-8") as f:
                  for line in f:
                      cleaned = clean_rule_line(line)
                      if cleaned:
                          rules.append(cleaned)
              return rules

          def merge_rules(existing_rules, new_rules):
              seen = set(existing_rules)
              merged = list(existing_rules)
              for r in new_rules:
                  if r not in seen:
                      seen.add(r)
                      merged.append(r)
              return merged

          for yaml_file in glob.glob(f"{RULES_DIR}/*.yaml"):
              base_name = os.path.splitext(os.path.basename(yaml_file))[0]

              with open(yaml_file, "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f) or {}

              payload = data.get("payload", [])
              yaml_domains = []
              yaml_ips = []

              for item in payload:
                  cleaned = clean_rule_line(str(item))
                  if not cleaned:
                      continue

                  parts = [p.strip() for p in cleaned.split(",")]
                  rule_type = parts[0].upper()

                  if rule_type in DOMAIN_TYPES:
                      yaml_domains.append(cleaned)
                  elif rule_type in IP_TYPES:
                      # 提取纯 CIDR（去除 IP-CIDR, 前缀和 no-resolve）
                      if len(parts) >= 2:
                          cidr = parts[1]
                          # 单个 IP 没有掩码时补齐 /32 或 /128
                          if "/" not in cidr:
                              cidr = f"{cidr}/128" if ":" in cidr else f"{cidr}/32"
                          yaml_ips.append(cidr)
                  elif "/" in cleaned or ":" in cleaned:
                      # 兼容原本就没有前缀的纯 CIDR
                      yaml_ips.append(cleaned)

              domain_list_file = os.path.join(RULES_DIR, f"{base_name}_domain.list")
              existing_domains = read_existing_list(domain_list_file)
              all_domains = merge_rules(existing_domains, yaml_domains)

              if all_domains:
                  with open(domain_list_file, "w", encoding="utf-8") as f:
                      f.write("\n".join(all_domains) + "\n")
                  
                  domain_mrs_file = os.path.join(RULES_DIR, f"{base_name}_domain.mrs")
                  subprocess.run(
                      ["mihomo", "convert-ruleset", "domain", "text", domain_list_file, domain_mrs_file],
                      check=True
                  )
                  print(f"[Domain] Updated {domain_list_file} (Total: {len(all_domains)}) -> Overwrote {domain_mrs_file}")

              ip_list_file = os.path.join(RULES_DIR, f"{base_name}_ip.list")
              existing_ips = read_existing_list(ip_list_file)
              
              # 清洗已存在文件中可能残留的旧前缀
              clean_existing_ips = []
              for ip in existing_ips:
                  p = [x.strip() for x in ip.split(",")]
                  if p[0].upper() in IP_TYPES and len(p) >= 2:
                      clean_existing_ips.append(p[1])
                  else:
                      clean_existing_ips.append(ip)

              all_ips = merge_rules(clean_existing_ips, yaml_ips)

              if all_ips:
                  with open(ip_list_file, "w", encoding="utf-8") as f:
                      f.write("\n".join(all_ips) + "\n")
                  
                  ip_mrs_file = os.path.join(RULES_DIR, f"{base_name}_ip.mrs")
                  try:
                      subprocess.run(
                          ["mihomo", "convert-ruleset", "ipcidr", "text", ip_list_file, ip_mrs_file],
                          check=True
                      )
                      print(f"[IP] Updated {ip_list_file} (Total: {len(all_ips)}) -> Overwrote {ip_mrs_file}")
                  except subprocess.CalledProcessError as e:
                      print(f"[Error] Failed to compile {ip_mrs_file}: {e}")
                      raise e
          EOF

      - name: Commit and Push to Rules
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Rules/*.list Rules/*.mrs
          if git diff --staged --quiet; then
            echo "No changes in .list or .mrs files."
          else
            git commit -m "Auto-append rules to list and overwrite MRS [skip ci]"
            git push
          fi